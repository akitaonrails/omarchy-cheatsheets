# Two-tier test convention (house style): the everyday `cargo t` loop skips
# tests in modules named slow*/stress*; `cargo tf` and CI run everything.

[profile.default]
default-filter = "not test(/(^|::)(slow|stress)[a-z0-9_]*::/)"
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "5s", terminate-after = 24 }

[profile.full]
default-filter = "all()"
retries = 0
slow-timeout = { period = "30s", terminate-after = 12 }

[profile.ci]
default-filter = "all()"
retries = 0
slow-timeout = { period = "60s", terminate-after = 10 }
