name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  validate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(awk '/^\[package\]/{f=1} f && /^version = /{gsub(/"/, "", $3); print $3; exit}' Cargo.toml)"
          if [ "$tag" != "$manifest" ]; then
            echo "Tag v$tag does not match Cargo.toml version $manifest" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  binary:
    name: binary ${{ matrix.target.name }}
    needs: validate-version
    runs-on: ${{ matrix.target.os }}
    # Ubuntu's Qt6 mkspecs inject -fuse-ld=gold; gold drops cxx-qt's
    # whole-archive initializer symbols. lld (last flag wins) works.
    env:
      RUSTFLAGS: "-D warnings -C link-arg=-fuse-ld=lld"
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: linux-x86_64, os: ubuntu-22.04 }
          - { name: linux-aarch64, os: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Qt6 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-declarative-dev libclang-dev cmake lld
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Build
        run: cargo build --locked --release
      - name: Package tarball
        run: |
          set -euo pipefail
          name="omarchy-cheatsheets-${{ matrix.target.name }}"
          mkdir -p "dist/$name"
          cp target/release/omarchy-cheatsheets "dist/$name/"
          cp packaging/omarchy-cheatsheets.desktop README.md "dist/$name/"
          tar -czf "$name.tar.gz" -C "dist/$name" omarchy-cheatsheets omarchy-cheatsheets.desktop README.md
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Smoke test tarball
        run: |
          set -euo pipefail
          name="omarchy-cheatsheets-${{ matrix.target.name }}"
          mkdir -p /tmp/smoke
          tar -xzf "$name.tar.gz" -C /tmp/smoke
          # --list-sections filters by tools present in PATH, which runners
          # don't have — check exit codes, not content.
          /tmp/smoke/omarchy-cheatsheets --help >/dev/null
          /tmp/smoke/omarchy-cheatsheets --list-sections >/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omarchy-cheatsheets-${{ matrix.target.name }}
          path: |
            omarchy-cheatsheets-${{ matrix.target.name }}.tar.gz
            omarchy-cheatsheets-${{ matrix.target.name }}.tar.gz.sha256

  github-release:
    name: github release
    needs: [binary, validate-version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: omarchy-cheatsheets-*
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "## Checksums"
            echo '```'
            cat artifacts/*.sha256
            echo '```'
            echo
            echo 'Install on Arch/Omarchy: `yay -S omarchy-cheatsheets-bin` (AUR) or unpack a tarball above.'
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "${{ github.repository }}" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --latest

  check-secrets:
    name: check publishing secrets
    runs-on: ubuntu-latest
    outputs:
      aur_enabled: ${{ steps.check.outputs.aur_enabled }}
    steps:
      - id: check
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "aur_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "aur_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::AUR_SSH_PRIVATE_KEY not set — skipping AUR publish. Add it in repo Settings → Secrets and variables → Actions."
          fi

  aur:
    name: aur publish
    needs: [check-secrets, github-release, validate-version]
    if: needs.check-secrets.outputs.aur_enabled == 'true'
    runs-on: ubuntu-latest
    container: archlinux@sha256:3406a568f45d68f0bef35dc80b3eacec8bda59b0292b2e50d5932ba1667f20cf # latest, 2026-07-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: omarchy-cheatsheets-*
          path: artifacts
          merge-multiple: true
      - name: Install AUR publish tools
        run: pacman -Syu --noconfirm --needed base-devel curl git openssh
      - name: Publish AUR packages
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          set -euo pipefail

          version="$VERSION"
          source_sha="$(curl -fsSL "https://github.com/akitaonrails/omarchy-cheatsheets/archive/refs/tags/v${version}.tar.gz" | sha256sum | awk '{print $1}')"
          bin_x86_sha="$(sha256sum artifacts/omarchy-cheatsheets-linux-x86_64.tar.gz | awk '{print $1}')"
          bin_arm_sha="$(sha256sum artifacts/omarchy-cheatsheets-linux-aarch64.tar.gz | awk '{print $1}')"

          useradd -m aurbuild
          chown -R aurbuild:aurbuild "$GITHUB_WORKSPACE"
          install -d -m 0700 -o aurbuild -g aurbuild /home/aurbuild/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /home/aurbuild/.ssh/aur
          chmod 0600 /home/aurbuild/.ssh/aur
          chown aurbuild:aurbuild /home/aurbuild/.ssh/aur
          ssh-keyscan aur.archlinux.org > /home/aurbuild/.ssh/known_hosts
          chown aurbuild:aurbuild /home/aurbuild/.ssh/known_hosts
          cat >/home/aurbuild/.ssh/config <<'SSHCFG'
          Host aur.archlinux.org
            HostName aur.archlinux.org
            User aur
            IdentityFile /home/aurbuild/.ssh/aur
            IdentitiesOnly yes
          SSHCFG
          chown aurbuild:aurbuild /home/aurbuild/.ssh/config
          chmod 0600 /home/aurbuild/.ssh/config

          runuser -u aurbuild -- env \
            HOME=/home/aurbuild \
            GIT_SSH_COMMAND='ssh -F /home/aurbuild/.ssh/config' \
            bash -s -- "$version" "$source_sha" "$bin_x86_sha" "$bin_arm_sha" "$GITHUB_WORKSPACE" <<'PUBLISH'
          set -euo pipefail

          version="$1"
          source_sha="$2"
          bin_x86_sha="$3"
          bin_arm_sha="$4"
          workspace="$5"
          workdir="/tmp/omarchy-cheatsheets-aur-publish"

          git config --global user.name "omarchy-cheatsheets release bot"
          git config --global user.email "actions@github.com"

          rm -rf "$workdir"
          mkdir -p "$workdir/generated"

          source_pkgbuild="$workdir/generated/PKGBUILD.source"
          bin_pkgbuild="$workdir/generated/PKGBUILD.bin"
          cp "$workspace/packaging/aur/PKGBUILD" "$source_pkgbuild"
          cp "$workspace/packaging/aur/PKGBUILD-bin" "$bin_pkgbuild"

          sed -i \
            -e "s/^pkgver=.*/pkgver=${version}/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums=('.*')/sha256sums=('${source_sha}')/" \
            "$source_pkgbuild"
          sed -i \
            -e "s/^pkgver=.*/pkgver=${version}/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums_x86_64=('.*')/sha256sums_x86_64=('${bin_x86_sha}')/" \
            -e "s/^sha256sums_aarch64=('.*')/sha256sums_aarch64=('${bin_arm_sha}')/" \
            "$bin_pkgbuild"

          publish_pkg() {
            pkgbase="$1"
            pkgbuild="$2"
            repo="$workdir/$pkgbase"

            git clone "ssh://aur@aur.archlinux.org/${pkgbase}.git" "$repo"
            cp "$pkgbuild" "$repo/PKGBUILD"
            cp "$workspace/packaging/aur/omarchy-cheatsheets.install" "$repo/omarchy-cheatsheets.install"
            (cd "$repo" && makepkg --printsrcinfo > .SRCINFO)
            (cd "$repo" && git add PKGBUILD .SRCINFO omarchy-cheatsheets.install)
            if (cd "$repo" && git diff --cached --quiet); then
              echo "$pkgbase already up to date"
              return
            fi
            (cd "$repo" && git commit -m "omarchy-cheatsheets v${version}")
            (cd "$repo" && git push)
          }

          publish_pkg "omarchy-cheatsheets" "$source_pkgbuild"
          publish_pkg "omarchy-cheatsheets-bin" "$bin_pkgbuild"
          PUBLISH
